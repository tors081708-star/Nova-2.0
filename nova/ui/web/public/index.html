<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA 2.0 Agent Dashboard & To-Do App</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --success-color: #238636;
      --danger-color: #da3633;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent-color);
    }
    .status-badge {
      background-color: var(--success-color);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
    }
    main {
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      color: var(--accent-color);
    }
    .todo-input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-color);
    }
    button {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
      margin-bottom: 0.5rem;
      border-radius: 4px;
    }
    li.todo-item.completed span {
      text-decoration: line-through;
      color: #8b949e;
    }
    .delete-btn {
      background-color: var(--danger-color);
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }
    #console-logs {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 4px;
      height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .log-entry {
      margin-bottom: 0.5rem;
    }
    .log-entry.user { color: var(--accent-color); }
    .log-entry.nova { color: #3fb950; }
  </style>
</head>
<body>
  <header>
    <h1>NOVA 2.0 Real-Time Dashboard</h1>
    <span class="status-badge" id="agent-status">Online (Autonomous)</span>
  </header>

  <main>
    <!-- To-Do Application Section with LocalStorage -->
    <section class="card" id="todo-app">
      <h2>To-Do Application (Local Storage)</h2>
      <div class="todo-input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." />
        <button id="add-todo-btn">Add Task</button>
      </div>
      <ul class="todo-list" id="todo-list"></ul>
    </section>

    <!-- Agent Monitoring & Console Section -->
    <section class="card" id="agent-console">
      <h2>Real-Time Agent Monitoring</h2>
      <div class="todo-input-group">
        <input type="text" id="agent-input" placeholder="Ask NOVA something..." />
        <button id="send-agent-btn">Send</button>
      </div>
      <div id="console-logs">
        <div class="log-entry nova">[NOVA System]: Agent monitor initialized. Ready for queries.</div>
      </div>
    </section>
  </main>

  <script>
    // Local Storage Task Management logic
    const todoInput = document.getElementById('todo-input');
    const addTodoBtn = document.getElementById('add-todo-btn');
    const todoList = document.getElementById('todo-list');

    let localTasks = JSON.parse(localStorage.getItem('nova_tasks') || '[]');

    function saveTasks() {
      localStorage.setItem('nova_tasks', JSON.stringify(localTasks));
    }

    function renderTasks() {
      todoList.innerHTML = '';
      if (localTasks.length === 0) {
        todoList.innerHTML = '<li class="todo-item"><span>No tasks yet! Add one above.</span></li>';
        return;
      }
      localTasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `todo-item ${task.completed ? 'completed' : ''}`;

        const span = document.createElement('span');
        span.textContent = task.title;
        span.style.cursor = 'pointer';
        span.onclick = () => toggleTask(index);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Delete';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteTask(index);
        };

        li.appendChild(span);
        li.appendChild(delBtn);
        todoList.appendChild(li);
      });
    }

    function addTask() {
      const text = todoInput.value.trim();
      if (!text) return;
      localTasks.push({ id: Date.now(), title: text, completed: false });
      saveTasks();
      renderTasks();
      todoInput.value = '';
    }

    function toggleTask(index) {
      localTasks[index].completed = !localTasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      localTasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    addTodoBtn.addEventListener('click', addTask);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    renderTasks();

    // Agent Monitoring interaction logic
    const agentInput = document.getElementById('agent-input');
    const sendAgentBtn = document.getElementById('send-agent-btn');
    const consoleLogs = document.getElementById('console-logs');

    function appendLog(role, message) {
      const div = document.createElement('div');
      div.className = `log-entry ${role.toLowerCase()}`;
      div.textContent = `[${role}]: ${message}`;
      consoleLogs.appendChild(div);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    async function sendQuery() {
      const query = agentInput.value.trim();
      if (!query) return;

      appendLog('User', query);
      agentInput.value = '';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });
        const data = await res.json();
        appendLog('NOVA', data.response);
      } catch (err) {
        appendLog('NOVA System', 'Error connecting to backend API. Simulating response locally.');
        appendLog('NOVA', `Processed locally: "${query}"`);
      }
    }

    sendAgentBtn.addEventListener('click', sendQuery);
    agentInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendQuery();
    });
  </script>
</body>
</html>
