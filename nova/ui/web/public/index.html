<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA 2.0 Agent Dashboard & Advanced To-Do App</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --success-color: #238636;
      --danger-color: #da3633;
      --warning-color: #d29922;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent-color);
    }
    .status-badge {
      background-color: var(--success-color);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.85rem;
    }
    main {
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      color: var(--accent-color);
    }
    .todo-input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"], input[type="date"], select {
      padding: 0.5rem 0.75rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-color);
    }
    input[type="text"] { flex: 1; min-width: 150px; }
    button {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { opacity: 0.9; }
    .secondary-btn {
      background-color: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
    }
    .filter-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    .filter-btn {
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      background-color: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }
    .filter-btn.active {
      background-color: var(--accent-color);
      color: white;
    }
    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
      margin-bottom: 0.5rem;
      border-radius: 4px;
    }
    li.todo-item.completed span.title {
      text-decoration: line-through;
      color: #8b949e;
    }
    .priority-badge {
      font-size: 0.75rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.5rem;
      font-weight: bold;
    }
    .priority-High { background-color: var(--danger-color); color: white; }
    .priority-Medium { background-color: var(--warning-color); color: black; }
    .priority-Low { background-color: #388bfd; color: white; }
    .due-date { font-size: 0.75rem; color: #8b949e; margin-left: 0.5rem; }
    .delete-btn {
      background-color: var(--danger-color);
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }
    #console-logs {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 4px;
      height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .log-entry { margin-bottom: 0.5rem; }
    .log-entry.user { color: var(--accent-color); }
    .log-entry.nova { color: #3fb950; }
  </style>
</head>
<body>
  <header>
    <h1>NOVA 2.0 Dashboard</h1>
    <span class="status-badge" id="agent-status">Online (Autonomous)</span>
  </header>

  <main>
    <!-- Enhanced To-Do Application Section -->
    <section class="card" id="todo-app">
      <h2>Advanced To-Do Application</h2>

      <div class="todo-input-group">
        <input type="text" id="todo-input" placeholder="Add task title..." />
        <select id="todo-priority">
          <option value="Medium">Medium Priority</option>
          <option value="High">High Priority</option>
          <option value="Low">Low Priority</option>
        </select>
        <input type="date" id="todo-due" />
        <button id="add-todo-btn">Add Task</button>
      </div>

      <div class="filter-group">
        <span style="font-size:0.85rem;">Filters:</span>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="high">High Priority</button>

        <div style="margin-left: auto;">
          <button class="secondary-btn" id="export-btn" style="font-size:0.75rem; padding:0.25rem 0.5rem;">Export JSON</button>
        </div>
      </div>

      <ul class="todo-list" id="todo-list"></ul>
    </section>

    <!-- Agent Monitoring & Console Section -->
    <section class="card" id="agent-console">
      <h2>Real-Time Agent Monitoring</h2>
      <div class="todo-input-group">
        <input type="text" id="agent-input" placeholder="Ask NOVA something..." />
        <button id="send-agent-btn">Send</button>
      </div>
      <div id="console-logs">
        <div class="log-entry nova">[NOVA System]: Agent monitor initialized. Ready for queries.</div>
      </div>
    </section>
  </main>

  <script>
    const todoInput = document.getElementById('todo-input');
    const todoPriority = document.getElementById('todo-priority');
    const todoDue = document.getElementById('todo-due');
    const addTodoBtn = document.getElementById('add-todo-btn');
    const todoList = document.getElementById('todo-list');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const exportBtn = document.getElementById('export-btn');

    let localTasks = JSON.parse(localStorage.getItem('nova_tasks') || '[]');
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('nova_tasks', JSON.stringify(localTasks));
    }

    function renderTasks() {
      todoList.innerHTML = '';

      let filtered = localTasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        if (currentFilter === 'high') return task.priority === 'High';
        return true;
      });

      if (filtered.length === 0) {
        todoList.innerHTML = '<li class="todo-item"><span style="color:#8b949e">No tasks match filter.</span></li>';
        return;
      }

      filtered.forEach((task) => {
        const index = localTasks.indexOf(task);
        const li = document.createElement('li');
        li.className = `todo-item ${task.completed ? 'completed' : ''}`;

        const detailsDiv = document.createElement('div');
        detailsDiv.style.cursor = 'pointer';
        detailsDiv.onclick = () => toggleTask(index);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = task.title;

        const prioritySpan = document.createElement('span');
        prioritySpan.className = `priority-badge priority-${task.priority || 'Medium'}`;
        prioritySpan.textContent = task.priority || 'Medium';

        detailsDiv.appendChild(titleSpan);
        detailsDiv.appendChild(prioritySpan);

        if (task.due_date) {
          const dueSpan = document.createElement('span');
          dueSpan.className = 'due-date';
          dueSpan.textContent = `Due: ${task.due_date}`;
          detailsDiv.appendChild(dueSpan);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = 'Delete';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteTask(index);
        };

        li.appendChild(detailsDiv);
        li.appendChild(delBtn);
        todoList.appendChild(li);
      });
    }

    function addTask() {
      const text = todoInput.value.trim();
      if (!text) return;
      localTasks.push({
        id: Date.now(),
        title: text,
        priority: todoPriority.value,
        due_date: todoDue.value || null,
        completed: false
      });
      saveTasks();
      renderTasks();
      todoInput.value = '';
      todoDue.value = '';
    }

    function toggleTask(index) {
      localTasks[index].completed = !localTasks[index].completed;
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      localTasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    addTodoBtn.addEventListener('click', addTask);
    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderTasks();
      });
    });

    exportBtn.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localTasks, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "nova_tasks_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    renderTasks();

    // Agent Monitoring interaction logic
    const agentInput = document.getElementById('agent-input');
    const sendAgentBtn = document.getElementById('send-agent-btn');
    const consoleLogs = document.getElementById('console-logs');

    function appendLog(role, message) {
      const div = document.createElement('div');
      div.className = `log-entry ${role.toLowerCase()}`;
      div.textContent = `[${role}]: ${message}`;
      consoleLogs.appendChild(div);
      consoleLogs.scrollTop = consoleLogs.scrollHeight;
    }

    async function sendQuery() {
      const query = agentInput.value.trim();
      if (!query) return;

      appendLog('User', query);
      agentInput.value = '';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query })
        });
        const data = await res.json();
        appendLog('NOVA', data.response);
      } catch (err) {
        appendLog('NOVA System', 'Processed locally');
        appendLog('NOVA', `Processed query: "${query}"`);
      }
    }

    sendAgentBtn.addEventListener('click', sendQuery);
    agentInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendQuery();
    });
  </script>
</body>
</html>
